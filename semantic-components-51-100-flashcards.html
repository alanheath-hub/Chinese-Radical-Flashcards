<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Radicals S51–S100 · Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Zhi+Mang+Xing&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f2ead9;
    --paper-2:#e9dfc7;
    --ink:#221d17;
    --ink-soft:#4b433a;
    --seal:#a3312a;
    --seal-dark:#7c231e;
    --gold:#a9812f;
    --line:#cbbb96;
    --card-back:#fbf6ea;
    --jade:#3f7a52;
  }
  *{box-sizing:border-box;}
  html, body{
    height:100%;
  }
  body{
    margin:0;
    height:100vh;
    height:100dvh;
    overflow:hidden;
    background:
      radial-gradient(circle at 15% 10%, rgba(169,129,47,0.08), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(163,49,42,0.06), transparent 45%),
      var(--paper);
    font-family:'Source Serif 4', serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:12px 16px;
  }
  .app{
    width:100%;
    max-width:440px;
    height:100%;
    max-height:720px;
    display:flex;
    flex-direction:column;
  }
  header{
    text-align:center;
    margin-bottom:8px;
    flex:0 0 auto;
  }
  .eyebrow{
    font-family:'Zhi Mang Xing', cursive;
    font-size:13px;
    color:var(--seal);
    letter-spacing:0.08em;
  }
  h1{
    font-family:'Noto Serif SC', serif;
    font-weight:700;
    font-size:20px;
    margin:2px 0 3px;
    letter-spacing:0.01em;
  }
  .sub{
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:0.04em;
  }

  .progress-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin:0 2px 10px;
    flex:0 0 auto;
  }
  .progress-track{
    flex:1;
    height:3px;
    background:var(--line);
    position:relative;
    border-radius:2px;
    overflow:hidden;
  }
  .progress-fill{
    position:absolute;
    left:0;top:0;bottom:0;
    background:var(--seal);
    width:0%;
    transition:width 0.35s ease;
  }
  .progress-label{
    font-size:12px;
    color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
    min-width:52px;
    text-align:right;
  }

  .stage{
    perspective:1600px;
    margin-bottom:12px;
    flex:1 1 auto;
    min-height:0;
    display:flex;
    justify-content:center;
  }
  .card{
    position:relative;
    height:100%;
    width:auto;
    max-width:400px;
    margin:0 auto;
    aspect-ratio:5/7;
    cursor:pointer;
    transform-style:preserve-3d;
    transition:transform 0.5s cubic-bezier(.4,.2,.2,1);
  }
  .card.flipped{ transform:rotateY(180deg); }
  .face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    border-radius:6px;
    background:var(--card-back);
    border:1px solid var(--line);
    box-shadow:0 1px 0 var(--line), 0 12px 30px -14px rgba(34,29,23,0.35);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:16px 16px;
    text-align:center;
    overflow-y:auto;
  }
  .face::before{
    content:"";
    position:absolute;
    inset:10px;
    border:1px solid var(--line);
    border-radius:3px;
    pointer-events:none;
    opacity:0.6;
  }
  .face-back{ transform:rotateY(180deg); }

  .idx-tag{
    position:absolute;
    top:10px; left:10px;
    font-family:'Noto Serif SC', serif;
    font-size:11px;
    color:#fff;
    background:var(--seal);
    padding:2px 8px 3px;
    border-radius:2px;
    letter-spacing:0.05em;
  }
  .form-hint{
    position:absolute;
    top:10px; right:10px;
    font-size:10px;
    color:var(--ink-soft);
    letter-spacing:0.04em;
    text-transform:uppercase;
    max-width:110px;
    text-align:right;
    line-height:1.25;
  }

  .hanzi-row{
    display:flex;
    align-items:baseline;
    justify-content:center;
    flex-wrap:wrap;
    gap:6px;
  }
  .hanzi{
    font-family:'Noto Serif SC', serif;
    font-size:min(24vw, 110px);
    line-height:1;
    color:var(--ink);
  }
  .hanzi-small-row{
    display:flex;
    align-items:baseline;
    justify-content:center;
    flex-wrap:wrap;
    gap:5px;
    margin-bottom:4px;
  }
  .hanzi-small{
    font-family:'Noto Serif SC', serif;
    font-size:40px;
    line-height:1;
    color:var(--ink);
  }
  .trad-wrap{
    position:relative;
    display:inline-block;
    margin-right:12px;
  }
  .trad-wrap[hidden]{ display:none; }
  .trad-char{
    font-family:'Noto Serif SC', serif;
    color:var(--ink-soft);
  }
  .trad-char-front{
    font-size:min(20vw, 92px);
  }
  .trad-char-back{
    font-size:36px;
  }
  .trad-badge{
    position:absolute;
    bottom:-4px;
    right:-8px;
    width:26px;
    height:26px;
    border:2.4px solid var(--seal);
    border-radius:50%;
    color:var(--seal);
    font-family:'Source Serif 4', serif;
    font-size:16px;
    font-weight:700;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--card-back);
  }
  .trad-badge.nudge-right{
    right:-26px;
  }
  .variant-wrap{
    position:relative;
    display:inline-block;
    margin-right:12px;
  }
  .variant-wrap[hidden]{ display:none; }
  .variant-char{
    font-family:'Noto Serif SC', serif;
    color:var(--ink-soft);
  }
  .variant-char-front{
    font-size:min(20vw, 92px);
  }
  .variant-char-back{
    font-size:36px;
  }
  .variant-badge{
    position:absolute;
    bottom:-4px;
    right:-8px;
    width:26px;
    height:26px;
    border:2.4px solid var(--jade);
    border-radius:50%;
    color:var(--jade);
    font-family:'Source Serif 4', serif;
    font-size:16px;
    font-weight:700;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--card-back);
  }
  .variant-badge.nudge-right{
    right:-26px;
  }
  .variant-badge-back{
    width:16px;
    height:16px;
    border-width:1.5px;
    font-size:10px;
    bottom:-3px;
    right:-6px;
  }
  .variant-badge-back.nudge-right{
    right:-20px;
  }
  .variant-note{
    font-size:10.5px;
    color:var(--ink-soft);
    margin-top:6px;
    letter-spacing:0.02em;
  }
  .tap-hint{
    position:absolute;
    bottom:10px;
    font-size:10px;
    color:var(--ink-soft);
    letter-spacing:0.08em;
    text-transform:uppercase;
    opacity:0.65;
  }

  .pinyin{
    font-family:'Noto Serif SC', serif;
    font-size:18px;
    font-weight:600;
    color:var(--seal-dark);
    margin-bottom:6px;
  }
  .meaning{
    font-size:12.5px;
    line-height:1.4;
    color:var(--ink);
    max-width:320px;
  }
  .rule{
    width:32px;
    height:1px;
    background:var(--gold);
    margin:8px 0;
  }

  .examples-label{
    font-size:9px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-top:8px;
    margin-bottom:4px;
  }
  .examples{
    display:flex;
    gap:8px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .example-chip{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:1px;
  }
  .example-chip .ex-ch{
    font-family:'Noto Serif SC', serif;
    font-size:19px;
    color:var(--ink);
  }
  .example-chip .ex-py{
    font-size:9px;
    color:var(--ink-soft);
  }

  .phrase-label{
    font-size:9px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-top:8px;
    margin-bottom:2px;
  }
  .phrase{
    font-family:'Noto Serif SC', serif;
    font-size:14px;
    font-weight:600;
    color:var(--gold);
  }
  .phrase-py{
    font-size:10px;
    color:var(--ink-soft);
    margin-top:1px;
  }
  .phrase-note{
    font-size:9.5px;
    color:var(--ink-soft);
    margin-top:2px;
    max-width:290px;
    font-style:italic;
  }

  .controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex:0 0 auto;
  }
  .nav-btn, .shuffle-btn{
    font-family:'Source Serif 4', serif;
    font-size:13px;
    background:transparent;
    border:1px solid var(--line);
    color:var(--ink);
    padding:8px 14px;
    border-radius:4px;
    cursor:pointer;
    transition:background 0.15s, border-color 0.15s;
  }
  .nav-btn:hover, .shuffle-btn:hover{
    background:var(--paper-2);
    border-color:var(--gold);
  }
  .nav-btn:disabled{
    opacity:0.35;
    cursor:default;
  }
  .nav-btn:focus-visible, .shuffle-btn:focus-visible, .card:focus-visible{
    outline:2px solid var(--seal);
    outline-offset:2px;
  }
  .nav-group{ display:flex; gap:8px; }

  .known-btn{
    font-size:12px;
    letter-spacing:0.05em;
    text-transform:uppercase;
  }

  footer{
    margin-top:10px;
    text-align:center;
    font-size:10px;
    color:var(--ink-soft);
    letter-spacing:0.03em;
    flex:0 0 auto;
  }

  @media (prefers-reduced-motion: reduce){
    .card{ transition:none; }
    .progress-fill{ transition:none; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="eyebrow">部首 · 说文解字</div>
    <h1>Radicals S51–S100</h1>
    <div class="sub">Tap the card to flip · use ← → to move between cards</div>
  </header>

  <div class="progress-row">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">1 / 50</div>
  </div>

  <div class="stage">
    <div class="card" id="card" tabindex="0" role="button" aria-label="Flashcard, tap to flip">
      <div class="face face-front">
        <span class="idx-tag" id="idxFront">S51</span>
        <span class="form-hint" id="formFront"></span>
        <div class="hanzi-row">
          <div class="hanzi" id="hanziFront">酉</div>
          <span class="trad-wrap" id="tradWrapFront" hidden>
            <span class="trad-char trad-char-front" id="tradCharFront"></span>
            <span class="trad-badge" id="tradBadgeFront">t</span>
          </span>
          <span class="variant-wrap" id="variantWrapFront" hidden>
            <span class="variant-char variant-char-front" id="variantCharFront"></span>
            <span class="variant-badge" id="variantBadgeFront">V</span>
          </span>
        </div>
        <div class="tap-hint">tap to reveal</div>
      </div>
      <div class="face face-back">
        <span class="idx-tag" id="idxBack">S51</span>
        <span class="form-hint" id="formBack"></span>
        <div class="hanzi-small-row">
          <div class="hanzi-small" id="hanziBack">酉</div>
          <span class="trad-wrap" id="tradWrapBack" hidden>
            <span class="trad-char trad-char-back" id="tradCharBack"></span>
            <span class="trad-badge" id="tradBadgeBack">t</span>
          </span>
          <span class="variant-wrap" id="variantWrapBack" hidden>
            <span class="variant-char variant-char-back" id="variantCharBack"></span>
            <span class="variant-badge variant-badge-back" id="variantBadgeBack">V</span>
          </span>
        </div>
        <div class="pinyin" id="pinyinBack">yǒu</div>
        <div class="rule"></div>
        <div class="meaning" id="meaningBack"></div>
        <div class="examples-label">Used in</div>
        <div class="examples" id="examplesBack"></div>
        <div class="phrase-label">Spoken as</div>
        <div class="phrase" id="phraseBack"></div>
        <div class="phrase-py" id="phrasePyBack"></div>
        <div class="phrase-note" id="phraseNoteBack"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="nav-group">
      <button class="nav-btn" id="prevBtn" aria-label="Previous card">← Prev</button>
      <button class="nav-btn" id="nextBtn" aria-label="Next card">Next →</button>
    </div>
    <button class="shuffle-btn" id="shuffleBtn">Shuffle</button>
  </div>

  <footer>Outlier Linguistics · Simplified Edition v1.2 · components 51–100</footer>
</div>

<script>
const DATA = [
  {n:51, ch:"酉", form:"", py:"yǒu", m:"A container for brewing or storing alcoholic drinks. Also the 10th Earthly Branch.", ex:[["酒","jiǔ"],["醒","xǐng"],["醋","cù"]], ph:"酉字旁", phpy:"yǒu zì páng"},
  {n:52, ch:"皿", form:"", py:"mǐn", m:"A bronze or clay vessel — a container or dish.", ex:[["盘","pán","盤"],["盆","pén"],["益","yì"]], ph:"皿字底", phpy:"mǐn zì dǐ"},
  {n:53, ch:"囗", form:"", py:"wéi", m:"The border of a city — to surround or enclose.", ex:[["国","guó","國"],["园","yuán","園"],["圆","yuán","圓"]], ph:"国字框", phpy:"guó zì kuàng"},
  {n:54, ch:"弓", form:"", py:"gōng", m:"A bow drawn back, ready to shoot — bow-shaped, bent, crooked.", ex:[["张","zhāng","張"],["弦","xián"],["弯","wān","彎"]], ph:"弓字旁", phpy:"gōng zì páng"},
  {n:55, ch:"斤", form:"", py:"jīn", m:"An axe used for cutting. Also a unit of weight (jīn, about half a kilogram).", ex:[["斧","fǔ"],["新","xīn"],["断","duàn","斷"]], ph:"斤字旁", phpy:"jīn zì páng"},
  {n:56, ch:"示", form:"", py:"shì", m:"An ancestral altar or tablet used in worship — related to religion; to show or indicate.", ex:[["票","piào"],["禁","jìn"],["祭","jì"]], ph:"示字底", phpy:"shì zì dǐ"},
  {n:57, ch:"礻", form:"variant of 示", py:"shì", m:"The compound form of 示, used on the left side of characters — related to worship and religion.", ex:[["社","shè"],["神","shén"],["祝","zhù"]], ph:"示补旁", phpy:"shì bǔ páng", note:"Traditionally paired with 衣补旁 (衤) — one dot is 示补, two strokes is 衣补."},
  {n:58, ch:"舟", form:"", py:"zhōu", m:"An overhead view of a boat — related to boats and navigation.", ex:[["船","chuán"],["航","háng"],["艘","sōu"]], ph:"舟字旁", phpy:"zhōu zì páng"},
  {n:59, ch:"戈", form:"", py:"gē", m:"An ancient dagger-axe — related to weapons, warfare, and fighting.", ex:[["战","zhàn","戰"],["我","wǒ"],["戏","xì","戲"]], ph:"戈字旁", phpy:"gē zì páng"},
  {n:60, ch:"门", trad:"門", form:"", py:"mén", m:"A double-sided door — a door, gate, or building; related to entrances.", ex:[["问","wèn","問"],["闪","shǎn","閃"],["间","jiān","間"]], ph:"门字框", phpy:"mén zì kuàng"},
  {n:61, ch:"矢", form:"", py:"shǐ", m:"An arrow, showing its tip, shaft, and feathered end.", ex:[["知","zhī"],["短","duǎn"],["矫","jiǎo","矯"]], ph:"矢字旁", phpy:"shǐ zì páng"},
  {n:62, ch:"缶", form:"", py:"fǒu", m:"An ancient earthenware jar with a narrow mouth, used to hold liquid or grain — a container or jar.", ex:[["缺","quē"],["罐","guàn"],["缸","gāng"]], ph:"缶字旁", phpy:"fǒu zì páng"},
  {n:63, ch:"斗", form:"", py:"dǒu", m:"A ladle or spoon for measuring alcohol or grain — related to measurement.", ex:[["料","liào"],["斜","xié"],["斗","dǒu"]], ph:"斗字旁", phpy:"dǒu zì páng"},
  {n:64, ch:"大", form:"", py:"dà", m:"A front view of a person with arms and legs spread — big, large.", ex:[["太","tài"],["天","tiān"],["夫","fū"]], ph:"大字头", phpy:"dà zì tóu"},
  {n:65, ch:"匕", form:"", py:"bǐ / huà", m:"A person turned upside down. Also used for a dagger or spoon.", ex:[["化","huà"],["北","běi"],["匙","chí"]], ph:"匕字旁", phpy:"bǐ zì páng"},

  {n:69, ch:"辶", variant:"辵", form:"", py:"chuò", m:"A foot beneath a crossroads — related to walking and movement.", ex:[["过","guò","過"],["送","sòng"],["道","dào"]], ph:"走之底", phpy:"zǒu zhī dǐ"},

  {n:71, ch:"耳", form:"", py:"ěr", m:"A human ear — related to hearing.", ex:[["听","tīng","聽"],["聪","cōng","聰"],["聊","liáo"]], ph:"耳字旁", phpy:"ěr zì páng"},
  {n:72, ch:"立", form:"", py:"lì", m:"A front view of a person standing on the ground — to stand; immediately.", ex:[["站","zhàn"],["童","tóng"],["竖","shù","豎"]], ph:"立字旁", phpy:"lì zì páng"},
  {n:73, ch:"寸", form:"", py:"cùn", m:"A hand with a mark just below the wrist — a short distance (the Chinese \"inch\"); related to the hand.", ex:[["对","duì","對"],["寺","sì"],["封","fēng"]], ph:"寸字旁", phpy:"cùn zì páng"},
  {n:74, ch:"欠", form:"", py:"qiàn", m:"A kneeling person with an open mouth, exhaling — related to breathing; to lack, to owe.", ex:[["吹","chuī"],["欢","huān","歡"],["歌","gē"]], ph:"欠字旁", phpy:"qiàn zì páng"},
  {n:75, ch:"子", form:"", py:"zǐ", m:"A swaddled child — related to children and birth.", ex:[["孩","hái"],["学","xué","學"],["字","zì"]], ph:"子字旁", phpy:"zǐ zì páng"},
  {n:76, ch:"饣", variant:"食", form:"", py:"shí", m:"The compound form of 食 — related to food and eating.", ex:[["饭","fàn","飯"],["饮","yǐn","飲"],["饿","è","餓"]], ph:"食字旁", phpy:"shí zì páng"},
  {n:77, ch:"彡", form:"", py:"shān", m:"Decorative hair-like strokes — patterns, stripes, ornamentation.", ex:[["形","xíng"],["影","yǐng"],["彩","cǎi"]], ph:"三撇儿", phpy:"sān piě r", note:"An informal name — 彡 rarely gets a formal 旁/头/底 label."},
  {n:78, ch:"毛", form:"", py:"máo", m:"Hair or animal fur. Also a unit of Chinese currency (1/10 yuán).", ex:[["毯","tǎn"],["毫","háo"],["毡","zhān","氈"]], ph:"毛字旁", phpy:"máo zì páng"},
  {n:79, ch:"见", trad:"見", form:"", py:"jiàn", m:"A person with an enlarged, emphasized eye — to see, to perceive.", ex:[["视","shì","視"],["觉","jué","覺"],["观","guān","觀"]], ph:"见字旁", phpy:"jiàn zì páng"},
  {n:80, ch:"亼", form:"", py:"jí", m:"A mouth or opening pointing downward — to gather, to combine.", ex:[["今","jīn"],["令","lìng"],["命","mìng"]], ph:"", phpy:"", note:"亼 has no common spoken name — it's a rare, mostly historical component."},
  {n:81, ch:"卩", form:"", py:"jié", m:"A person kneeling — related to kneeling and to people in general.", ex:[["印","yìn"],["却","què","卻"],["卸","xiè"]], ph:"卩字旁", phpy:"jié zì páng", note:"Sometimes loosely called 单耳旁, though that name more properly belongs elsewhere."},
  {n:82, ch:"臣", form:"", py:"chén", m:"The exaggerated eye of a kneeling subject looking up — a minister or official.", ex:[["卧","wò","臥"],["宦","huàn"]], ph:"", phpy:"", note:"臣 has no common standalone spoken name — it's usually just called by the character 臣 itself."},
  {n:83, ch:"尸", form:"", py:"shī", m:"A person squatting down. Also used to mean a corpse or dead body.", ex:[["尾","wěi"],["屋","wū"],["局","jú"]], ph:"尸字头", phpy:"shī zì tóu"},
  {n:84, ch:"马", trad:"馬", form:"", py:"mǎ", m:"A horse, shown with its flowing mane.", ex:[["骑","qí","騎"],["驶","shǐ","駛"],["驻","zhù","駐"]], ph:"马字旁", phpy:"mǎ zì páng"},
  {n:85, ch:"隹", form:"", py:"zhuī", m:"A short-tailed bird.", ex:[["集","jí"],["难","nán","難"],["雄","xióng"]], ph:"隹字旁", phpy:"zhuī zì páng"},
  {n:86, ch:"鸟", trad:"鳥", form:"", py:"niǎo", m:"A bird — typically a long-tailed one.", ex:[["鸡","jī","雞"],["鸭","yā","鴨"],["鹰","yīng","鷹"]], ph:"鸟字旁", phpy:"niǎo zì páng"},
  {n:87, ch:"羊", form:"", py:"yáng", m:"A front view of a ram's head with curling horns — sheep, goat.", ex:[["美","měi"],["群","qún"],["羡","xiàn","羨"]], ph:"羊字头", phpy:"yáng zì tóu"},
  {n:88, ch:"羽", form:"", py:"yǔ", m:"A pair of feathered wings — feathers, related to flight.", ex:[["翅","chì"],["翻","fān"],["翼","yì"]], ph:"羽字旁", phpy:"yǔ zì páng"},
  {n:89, ch:"牛", form:"", py:"niú", m:"A front view of an ox's head with horns — cow, bull.", ex:[["特","tè"],["牧","mù"],["物","wù"]], ph:"牛字旁", phpy:"niú zì páng"},
  {n:90, ch:"鱼", trad:"魚", form:"", py:"yú", m:"A fish, shown with head, body, scales, and tail.", ex:[["鲜","xiān","鮮"],["鲨","shā","鯊"],["渔","yú","漁"]], ph:"鱼字旁", phpy:"yú zì páng"},
  {n:91, ch:"革", form:"", py:"gé / jí", m:"An animal skin being stretched and worked into leather.", ex:[["鞋","xié"],["鞍","ān"],["靴","xuē"]], ph:"革字旁", phpy:"gé zì páng"},
  {n:92, ch:"穴", form:"", py:"xué", m:"A cave, den, or hole — an opening; also an acupuncture point.", ex:[["空","kōng"],["穿","chuān"],["窗","chuāng"]], ph:"穴字头", phpy:"xué zì tóu"},
  {n:93, ch:"衣", form:"", py:"yī", m:"Clothing worn on the upper body — clothes in general.", ex:[["装","zhuāng","裝"],["裂","liè"],["衷","zhōng"]], ph:"衣字底", phpy:"yī zì dǐ"},
  {n:94, ch:"衤", form:"variant of 衣", py:"yī", m:"The compound form of 衣, used on the left side of characters — related to clothing.", ex:[["袜","wà","襪"],["裤","kù","褲"],["被","bèi"]], ph:"衣补旁", phpy:"yī bǔ páng", note:"Traditionally paired with 示补旁 (礻) — two strokes is 衣补, one dot is 示补."},
  {n:95, ch:"巾", form:"", py:"jīn", m:"A hanging piece of cloth — cloth, related to textiles.", ex:[["帽","mào"],["帮","bāng","幫"],["幕","mù"]], ph:"巾字旁", phpy:"jīn zì páng"},
  {n:96, ch:"工", form:"", py:"gōng", m:"A shovel-like tool with a blade on one end — work, skill, achievement, contribution.", ex:[["功","gōng"],["攻","gōng"],["巧","qiǎo"]], ph:"工字旁", phpy:"gōng zì páng"},
  {n:97, ch:"雨", form:"", py:"yǔ", m:"Rain falling from a cloud — related to weather phenomena.", ex:[["雪","xuě"],["雷","léi"],["雾","wù","霧"]], ph:"雨字头", phpy:"yǔ zì tóu"},
  {n:98, ch:"冰", variant:"氷", form:"", py:"bīng", m:"Ice, or ice crystals forming — related to cold and freezing.", ex:[["冷","lěng"],["冻","dòng","凍"],["凉","liáng"]], ph:"两点水", phpy:"liǎng diǎn shuǐ"},
  {n:99, ch:"气", form:"", py:"qì", m:"Rising vapor or mist — gas, vapor; also the traditional Chinese concept of qì (vital energy).", ex:[["汽","qì"],["氧","yǎng"],["氢","qīng","氫"]], ph:"气字头", phpy:"qì zì tóu"},
  {n:100, ch:"厂", form:"", py:"hàn", m:"A rock cliff or overhang.", ex:[["厨","chú","廚"],["原","yuán"],["历","lì","歷"]], ph:"厂字头", phpy:"chǎng zì tóu"}
];

let order = DATA.map((_, i) => i);
let pos = 0;
let flipped = false;

const card = document.getElementById('card');
const idxFront = document.getElementById('idxFront');
const idxBack = document.getElementById('idxBack');
const formFront = document.getElementById('formFront');
const formBack = document.getElementById('formBack');
const hanziFront = document.getElementById('hanziFront');
const hanziBack = document.getElementById('hanziBack');
const tradWrapFront = document.getElementById('tradWrapFront');
const tradCharFront = document.getElementById('tradCharFront');
const tradWrapBack = document.getElementById('tradWrapBack');
const tradCharBack = document.getElementById('tradCharBack');
const tradBadgeFront = document.getElementById('tradBadgeFront');
const tradBadgeBack = document.getElementById('tradBadgeBack');
const variantWrapFront = document.getElementById('variantWrapFront');
const variantCharFront = document.getElementById('variantCharFront');
const variantWrapBack = document.getElementById('variantWrapBack');
const variantCharBack = document.getElementById('variantCharBack');
const variantBadgeFront = document.getElementById('variantBadgeFront');
const variantBadgeBack = document.getElementById('variantBadgeBack');
const BADGE_NUDGE_RIGHT = new Set([60, 79, 84, 86, 90, 69, 76, 98]);
const pinyinBack = document.getElementById('pinyinBack');
const meaningBack = document.getElementById('meaningBack');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const shuffleBtn = document.getElementById('shuffleBtn');
const examplesBack = document.getElementById('examplesBack');
const phraseBack = document.getElementById('phraseBack');
const phrasePyBack = document.getElementById('phrasePyBack');
const phraseNoteBack = document.getElementById('phraseNoteBack');

function render(){
  const item = DATA[order[pos]];
  idxFront.textContent = 'S' + item.n;
  idxBack.textContent = 'S' + item.n;
  formFront.textContent = item.form;
  formBack.textContent = item.form;
  hanziFront.textContent = item.ch;
  hanziBack.textContent = item.ch;
  if(item.trad){
    tradCharFront.textContent = item.trad;
    tradCharBack.textContent = item.trad;
    tradWrapFront.hidden = false;
    tradWrapBack.hidden = false;
    const nudge = BADGE_NUDGE_RIGHT.has(item.n);
    tradBadgeFront.classList.toggle('nudge-right', nudge);
    tradBadgeBack.classList.toggle('nudge-right', nudge);
  } else {
    tradWrapFront.hidden = true;
    tradWrapBack.hidden = true;
  }
  if(item.variant){
    variantCharFront.textContent = item.variant;
    variantCharBack.textContent = item.variant;
    variantWrapFront.hidden = false;
    variantWrapBack.hidden = false;
    const nudge = BADGE_NUDGE_RIGHT.has(item.n);
    variantBadgeFront.classList.toggle('nudge-right', nudge);
    variantBadgeBack.classList.toggle('nudge-right', nudge);
  } else {
    variantWrapFront.hidden = true;
    variantWrapBack.hidden = true;
  }
  pinyinBack.textContent = item.py;
  meaningBack.textContent = item.m;

  phraseBack.textContent = item.ph || '';
  phrasePyBack.textContent = item.phpy || '';
  phraseNoteBack.textContent = item.note || '';

  examplesBack.innerHTML = '';
  (item.ex || []).forEach(([ch, py]) => {
    const chip = document.createElement('div');
    chip.className = 'example-chip';
    const chSpan = document.createElement('div');
    chSpan.className = 'ex-ch';
    chSpan.textContent = ch;
    const pySpan = document.createElement('div');
    pySpan.className = 'ex-py';
    pySpan.textContent = py;
    chip.appendChild(chSpan);
    chip.appendChild(pySpan);
    examplesBack.appendChild(chip);
  });

  card.classList.remove('flipped');
  flipped = false;

  const total = DATA.length;
  progressFill.style.width = ((pos) / (total - 1) * 100) + '%';
  progressLabel.textContent = (pos + 1) + ' / ' + total;

  prevBtn.disabled = pos === 0;
  nextBtn.disabled = pos === total - 1;
}

function flip(){
  flipped = !flipped;
  card.classList.toggle('flipped', flipped);
}

function next(){
  if(pos < DATA.length - 1){ pos++; render(); }
}
function prev(){
  if(pos > 0){ pos--; render(); }
}
function shuffle(){
  for(let i = order.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  pos = 0;
  render();
}

card.addEventListener('click', flip);
card.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); flip(); }
});
prevBtn.addEventListener('click', prev);
nextBtn.addEventListener('click', next);
shuffleBtn.addEventListener('click', shuffle);

document.addEventListener('keydown', (e) => {
  if(e.key === 'ArrowRight') next();
  if(e.key === 'ArrowLeft') prev();
});

render();
</script>
</body>
</html>
